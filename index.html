<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Icones : tuile du logo (Figma 42:77). SVG pour les navigateurs
         recents, PNG et ICO pour les autres, apple-touch-icon carree (iOS
         arrondit lui-meme), icones 192 et 512 dans le manifeste. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0A0F2B" />

    <!-- Valeurs par defaut, celles de l'accueil. Au build, chaque page
         publiee recoit sa copie de ce fichier avec ses propres valeurs
         (vite.config.ts) ; dans le navigateur, useTitre les met a jour a
         chaque changement de page. Source : src/data/referencement.ts.
         Ne pas changer l'ordre des attributs (property/name puis content) :
         le build les remplace par motif. -->
    <title>Les Nuits du Capital Investissement · Lyon, mi-janvier 2027</title>
    <meta
      name="description"
      content="Deux jours pour réunir fonds, banques, conseils, dirigeants et étudiants à Lyon, mi-janvier 2027. Tables rondes, rendez-vous qualifiés et finale du hackathon. Pré-inscriptions ouvertes."
    />

    <link rel="canonical" href="https://nuitsducapitalinvestissement.fr/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Les Nuits du Capital Investissement" />
    <meta property="og:url" content="https://nuitsducapitalinvestissement.fr/" />
    <meta
      property="og:title"
      content="Les Nuits du Capital Investissement · Lyon, mi-janvier 2027"
    />
    <meta
      property="og:description"
      content="Deux jours pour réunir fonds, banques, conseils, dirigeants et étudiants à Lyon, mi-janvier 2027. Tables rondes, rendez-vous qualifiés et finale du hackathon. Pré-inscriptions ouvertes."
    />
    <!-- Images de partage 1 200 x 630 dans public/og/ (og-accueil par defaut). -->
    <meta property="og:image" content="https://nuitsducapitalinvestissement.fr/og/og-accueil.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Les Nuits du Capital Investissement, Lyon, mi-janvier 2027"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://nuitsducapitalinvestissement.fr/og/og-accueil.png"
    />

    <!-- Police hebergee sur le site (public/fonts/, licence OFL) : le
         fichier latin est precharge, @font-face dans
         src/styles/typographie.css (font-display: swap). -->
    <link
      rel="preload"
      href="/fonts/schibsted-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
