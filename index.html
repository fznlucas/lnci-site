<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- figma 42:77 ; apple-touch-icon carrée, ios arrondit lui-même -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0A0F2B" />

    <!-- valeurs de l'accueil, réécrites par page au build (vite.config.ts)
         garder l'ordre property/name puis content, le build remplace par motif -->
    <title>Les Nuits du Capital Investissement · Lyon, mi-janvier 2027</title>
    <meta
      name="description"
      content="Deux jours pour réunir fonds, banques, conseils, dirigeants et étudiants à Lyon, mi-janvier 2027. Tables rondes, rendez-vous qualifiés et finale du hackathon. Pré-inscriptions ouvertes."
    />

    <link rel="canonical" href="https://nuitsducapitalinvestissement.fr/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Les Nuits du Capital Investissement" />
    <meta property="og:url" content="https://nuitsducapitalinvestissement.fr/" />
    <meta
      property="og:title"
      content="Les Nuits du Capital Investissement · Lyon, mi-janvier 2027"
    />
    <meta
      property="og:description"
      content="Deux jours pour réunir fonds, banques, conseils, dirigeants et étudiants à Lyon, mi-janvier 2027. Tables rondes, rendez-vous qualifiés et finale du hackathon. Pré-inscriptions ouvertes."
    />
    <!-- 1200 x 630, dans public/og/ -->
    <meta property="og:image" content="https://nuitsducapitalinvestissement.fr/og/og-accueil.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Les Nuits du Capital Investissement, Lyon, mi-janvier 2027"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://nuitsducapitalinvestissement.fr/og/og-accueil.png"
    />

    <!-- police auto-hébergée, @font-face dans src/styles/typographie.css -->
    <link
      rel="preload"
      href="/fonts/schibsted-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
