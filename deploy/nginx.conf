# Les Nuits du Capital Investissement : site statique (dist/) servi par Nginx
# à copier dans /etc/nginx/sites-available/lnci puis à lier dans sites-enabled
# installation pas à pas : docs/DEPLOIEMENT.md

# cache selon le chemin servi ($uri vaut le fichier trouvé par try_files)
# un add_header dans un location écraserait les en-têtes de sécurité, d'où le map
map $uri $lnci_cache {
    ~^/assets/        "public, max-age=31536000, immutable";
    ~\.html$          "no-cache";
    ~/$               "no-cache";
    ~^/og/            "public, max-age=86400";
    default           "public, max-age=3600";
}

# http : défi Let's Encrypt, puis redirection vers https
server {
    listen 80;
    listen [::]:80;
    server_name nuitsducapitalinvestissement.fr www.nuitsducapitalinvestissement.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://nuitsducapitalinvestissement.fr$request_uri;
    }
}

# www vers le domaine nu
server {
    # http2 sur la ligne listen : compatible avec le nginx d'ubuntu 24.04 et debian 12
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.nuitsducapitalinvestissement.fr;

    ssl_certificate /etc/letsencrypt/live/nuitsducapitalinvestissement.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nuitsducapitalinvestissement.fr/privkey.pem;

    return 301 https://nuitsducapitalinvestissement.fr$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nuitsducapitalinvestissement.fr;

    root /var/www/lnci;
    index index.html;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/nuitsducapitalinvestissement.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nuitsducapitalinvestissement.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # en-têtes de sécurité de base
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cache-Control $lnci_cache always;

    # csp à activer une fois l'adresse de l'api connue : la mettre dans connect-src
    # (les styles en ligne viennent des composants react, d'où 'unsafe-inline')
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.exemple.fr; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;

    # page html de la route si elle existe (pages de partage), sinon l'app
    # $uri/index.html et non $uri/ : pas de redirection vers /programme/
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # les fichiers hachés ne changent jamais : inutile de les journaliser
    location /assets/ {
        access_log off;
        try_files $uri =404;
    }

    # certains mime.types ne connaissent pas .webmanifest
    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
    }
}
